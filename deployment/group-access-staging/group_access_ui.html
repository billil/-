<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>群忆 · 群访问申请</title><link rel="stylesheet" href="/group-access/ui.css"></head>
<body><main><header><div><p class="eyebrow">群忆 · 群访问</p><h1>管理你关注的群</h1><p>输入群管理员提供的群标识，提交申请。通过后可查看授权消息。</p></div><a href="/">返回消息中心</a></header>
<div id="notice" role="status"></div><div class="layout"><section class="panel"><h2>申请加入</h2><form id="apply"><label for="group">群号或群标识</label><input id="group" required maxlength="160" placeholder="输入已接入的群号"><label for="note">身份说明</label><input id="note" maxlength="300" placeholder="例如：班级及姓名，方便管理员核实"><button>提交申请</button></form><h2>我的申请</h2><div id="requests" class="stack"></div></section>
<section class="panel"><h2>群消息</h2><form id="search" class="search"><input id="question" required maxlength="2000" placeholder="输入你想查找的信息"><button>智能查找</button></form><div id="answer" class="answer"></div><div class="bar"><h3>最新消息</h3><button class="subtle" id="refresh" type="button">刷新</button></div><div id="messages" class="stack"></div></section></div>
<section class="panel admin" id="admin-panel" hidden><div class="bar"><h2>管理员审核</h2><button class="subtle" id="refresh-admin" type="button">刷新</button></div><p>请先在群外核实申请人的群成员身份，再决定是否通过。</p><div class="layout"><div><h3>待审核</h3><div id="pending" class="stack"></div></div><div><h3>已授权成员</h3><div id="members" class="stack"></div></div></div></section>
</main><script src="/group-access/ui.js" defer></script></body></html>
